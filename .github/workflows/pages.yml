name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Enrich from Quran Foundation API (optional)
        env:
          QURAN_CLIENT_ID: ${{ secrets.QURAN_CLIENT_ID }}
          QURAN_CLIENT_SECRET: ${{ secrets.QURAN_CLIENT_SECRET }}
        run: |
          if [ -n "$QURAN_CLIENT_ID" ] && [ -n "$QURAN_CLIENT_SECRET" ]; then
            python scripts/enrich_qf.py
          else
            echo "Skipping QF enrich — QURAN_CLIENT_ID / QURAN_CLIENT_SECRET not set."
          fi

      - run: python scripts/build_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
