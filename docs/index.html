<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="theme-color" content="#f5f0e6">
  <meta name="description" content="Read the Holy Quran with contemplation — word by word, ayah by ayah.">
  <title>Al-Qur'an</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="preload" href="https://verses.quran.foundation/fonts/quran/hafs/uthmanic_hafs/UthmanicHafs1Ver18.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="reader.css?v=17">
</head>
<body>
  <div class="ambient-pattern" aria-hidden="true"></div>
  <div class="ambient-glow" aria-hidden="true"></div>

  <header class="site-header">
    <div class="header-inner">
      <a href="#/" class="logo" aria-label="Home">
        <span class="logo-icon" aria-hidden="true">
          <svg class="logo-svg" viewBox="0 0 36 36" width="34" height="34" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 8c0-1.1.9-2 2-2h9v24H8c-1.1 0-2-.9-2-2V8z" fill="var(--green-light)" stroke="var(--green)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M30 8c0-1.1-.9-2-2-2H19v24h9c1.1 0 2-.9 2-2V8z" fill="var(--green-light)" stroke="var(--green)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M18 6v24" stroke="var(--gold-muted)" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M9 12h6M9 16h5M9 20h6" stroke="var(--green)" stroke-width="0.9" stroke-linecap="round" opacity="0.35"/>
            <path d="M21 12h6M22 16h5M21 20h6" stroke="var(--green)" stroke-width="0.9" stroke-linecap="round" opacity="0.35"/>
            <circle cx="18" cy="18" r="3.2" fill="var(--gold-soft)" opacity="0.55"/>
            <path d="M18 15.8l.55 1.65h1.75l-1.42 1.03.54 1.65L18 19.1l-1.42 1.03.54-1.65-1.42-1.03h1.75L18 15.8z" fill="var(--green)" opacity="0.7"/>
          </svg>
        </span>
        <span class="logo-text">
          <span class="logo-ar" dir="rtl" lang="ar">القُرْآن</span>
          <span class="logo-en">Al-Qur'an</span>
        </span>
      </a>
      <nav id="breadcrumb" class="breadcrumb" aria-label="Location"></nav>
      <div class="header-actions">
        <nav class="header-nav" aria-label="Site">
          <a href="#/tadabbur" class="nav-link" title="My tadabbur">
            <span class="nav-icon" aria-hidden="true">✎</span>
            <span class="nav-label">Tadabbur</span>
          </a>
          <a href="#/edits" class="nav-link" title="Edited meanings">
            <span class="nav-icon" aria-hidden="true">A·</span>
            <span class="nav-label">Edits</span>
          </a>
          <a href="#/bookmarks" class="nav-link" title="Bookmarks">
            <span class="nav-icon" aria-hidden="true">✧</span>
            <span class="nav-label">Bookmarks</span>
          </a>
        </nav>
        <div id="sync-badge" class="sync-badge" hidden></div>
      </div>
    </div>
  </header>

  <main id="app" class="app"><div class="loading">Loading…</div></main>

  <div id="word-tooltip" class="word-tooltip" hidden role="tooltip"></div>

  <footer class="site-footer">
    <p class="footer-verse" dir="rtl">أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ</p>
    <p class="footer-translation">Verily, in the remembrance of Allah do hearts find rest <span class="footer-ref">— 13:28</span></p>
    <p class="footer-note">Run <code>python scripts/serve.py</code> locally to sync reflections to your notes</p>
  </footer>

  <script src="reader.js?v=16"></script>
</body>
</html>
