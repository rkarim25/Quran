<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="theme-color" content="#f5f0e6">
  <meta name="description" content="Read the Holy Quran with contemplation — word by word, ayah by ayah.">
  <title>Al-Qur'an</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="preload" href="https://verses.quran.foundation/fonts/quran/hafs/uthmanic_hafs/UthmanicHafs1Ver18.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="reader.css?v=7">
</head>
<body>
  <div class="ambient-pattern" aria-hidden="true"></div>
  <div class="ambient-glow" aria-hidden="true"></div>

  <header class="site-header">
    <div class="header-inner">
      <a href="#/" class="logo" aria-label="Home">
        <span class="logo-mark" aria-hidden="true">۞</span>
        <span class="logo-text">
          <span class="logo-ar">القرآن</span>
          <span class="logo-en">Al-Qur'an</span>
        </span>
      </a>
      <nav id="breadcrumb" class="breadcrumb"></nav>
      <nav class="header-nav" aria-label="Site">
        <a href="#/bookmarks" class="nav-link">Bookmarks</a>
      </nav>
      <div id="sync-badge" class="sync-badge" hidden></div>
    </div>
  </header>

  <main id="app" class="app"><div class="loading">Loading…</div></main>

  <div id="word-tooltip" class="word-tooltip" hidden role="tooltip"></div>

  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <aside id="study-drawer" class="study-drawer" hidden aria-labelledby="drawer-title">
    <div class="drawer-header">
      <span id="drawer-title" class="drawer-title"></span>
      <button type="button" id="close-drawer" class="icon-btn close-btn" aria-label="Close">×</button>
    </div>
    <div id="drawer-panel" class="drawer-panel"></div>
  </aside>

  <footer class="site-footer">
    <p class="footer-verse" dir="rtl">أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ</p>
    <p class="footer-translation">Verily, in the remembrance of Allah do hearts find rest <span class="footer-ref">— 13:28</span></p>
    <p class="footer-note">Run <code>python scripts/serve.py</code> locally to sync reflections to your notes</p>
  </footer>

  <script src="reader.js?v=7"></script>
</body>
</html>
